<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- PWA -->
		<link rel="manifest" href="manifest.json" />

		<!-- CSS Globals -->
		<style>
			* {
				box-sizing: border-box;
			}
			:root {
				interpolate-size: allow-keywords;
				height: 100%;
				color-scheme: light dark;
				--primary-color: light-dark(#2e2830, #efefec);
				/* --secondary-color: light-dark(#efedea, #1a181c); */
				--secondary-color: light-dark(#e5e1ea, #1a181c);
				--link-color: light-dark(#8927eb, #cda0fb);

				--primary-color: hsl(0, 60%, 58%);

				/* Theme */
				--bg-dark: light-dark(
					oklch(from var(--primary-color) 90% 0 h),
					oklch(from var(--primary-color) 10% 0 h)
				);
				--bg: light-dark(
					oklch(from var(--primary-color) 95% 0 h),
					oklch(from var(--primary-color) 15% 0 h)
				);
				--bg-light: light-dark(
					oklch(from var(--primary-color) 100% 0 h),
					oklch(from var(--primary-color) 20% 0 h)
				);

				--text: light-dark(oklch(5% 0 0), oklch(95% 0 0));
				--text-muted: light-dark(oklch(30% 0 0), oklch(70% 0 0));

				/* --bg-dark: light-dark(oklab(90% 0 0), oklab(10% 0 0));
				--bg: light-dark(oklab(95% 0 0), oklab(15% 0 0));
				--bg-light: light-dark(oklab(100% 0 0), oklab(20% 0 0));

				--text: light-dark(oklab(5% 0 0), oklab(95% 0 0));
				--text-muted: light-dark(oklab(30% 0 0), oklab(70% 0 0)); */

				/* Font */
				--font-size: 18px;
				--font-family: sans-serif;

				/* Border Radius */
				--border-radius-1: 2px;
				--border-radius-2: 3px;
				--border-radius-3: 5px;
				--border-radius-4: 8px;

				/* Padding */
				--padding-1: 2px;
				--padding-2: 3px;
				--padding-3: 5px;
				--padding-4: 8px;
				--padding-5: 13px;
				--padding-6: 21px;
				--padding-7: 34px;

				/* Flex Gap */
				--flex-gap-1: 2px;
				--flex-gap-2: 3px;
				--flex-gap-3: 5px;
				--flex-gap-4: 8px;

				/* Margin */
				--margin-1: 2px;
				--margin-2: 3px;
				--margin-3: 5px;
				--margin-4: 8px;

				/* Calendar */
				--calendar-row-height: 60px;
				--calendar-cell-padding: var(--padding-3);
			}

			body {
				height: 100%;

				background-color: var(--bg-dark);

				font-size: var(--font-size);
				font-family: var(--font-family);
				color: var(--text);
			}

			button {
				font-size: var(--font-family);
				background-color: var(--bg-light);
			}
		</style>
		%sveltekit.head%
	</head>
	<script>
		window.addEventListener('beforeinstallprompt', (event) => {
			event.preventDefault();
			window.installPrompt = event;
		});
	</script>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
